<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汐沫的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(
                to bottom,
                #FFD700 0%,      /* 黄色 */
                #FFD700 25%,
                #FFFFFF 25%,     /* 白色 */
                #FFFFFF 50%,
                #9C4DC4 50%,     /* 紫色 */
                #9C4DC4 75%,
                #000000 75%,     /* 黑色 */
                #000000 100%
            );
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .page-content {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: #111;
            margin-bottom: 4px;
        }

        .profile-meta {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .info-item:last-of-type {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-size: 14px;
        }

        .info-value {
            color: #333;
            font-weight: 500;
            font-size: 15px;
        }

        /* 导航菜单样式 */
        .nav-menu {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 14px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            color: #333;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, background 0.2s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            background: #ffffff;
        }

        .footer-text {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="page-content">
        <div class="header">⚡ 汐沫的个人主页</div>

        <div class="card">
            <div class="profile-name">汐沫</div>
            <div class="profile-meta">16岁 · mtx.</div>

            <div class="info-item">
                <div class="info-label">QQ 号码</div>
                <div class="info-value">2132248873</div>
            </div>

            <div class="info-item">
                <div class="info-label">电话号码</div>
                <div class="info-value">19217264755</div>
            </div>
        </div>

        <div class="nav-menu">
            <a href="bio.html" class="nav-btn">✨ 自我介绍</a>
            <a href="articles.html" class="nav-btn">📝 我的文章</a>
        </div>

        <div class="footer-text">很高兴认识你</div>
    </div>

</body>
</html>
