<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的文章 - 汐沫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(to bottom, #FFD700 0%, #FFD700 25%, #FFFFFF 25%, #FFFFFF 50%, #9C4DC4 50%, #9C4DC4 75%, #000000 75%, #000000 100%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .page-content {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: linear-gradient(135deg, rgba(174, 223, 242, 0.85) 0%, rgba(247, 198, 207, 0.85) 100%);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #111;
            margin-bottom: 16px;
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .article-item {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            border-radius: 8px;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .article-item:last-of-type {
            border-bottom: none;
        }

        .article-item:hover {
            background: rgba(255, 255, 255, 0.25); /* 在渐变卡片上悬停时轻微泛白 */
        }

        .article-title {
            font-weight: 600;
            color: #222;
            font-size: 16px;
        }

        .article-date {
            font-size: 12px;
            color: #555;
        }

        .back-btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            background: linear-gradient(135deg, rgba(174, 223, 242, 0.85) 0%, rgba(247, 198, 207, 0.85) 100%);
            backdrop-filter: blur(10px);
            color: #22px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: filter 0.2s;
        }

        .back-btn:hover {
            filter: brightness(1.05);
        }
    </style>
</head>
<body>

    <div class="page-content">
        <div class="card">
            <div class="section-title">📝 文章列表</div>
            <div class="article-list">
                <a href="post1.html" class="article-item">
                    <span class="article-title">👋 欢迎来到我的个人主页</span>
                    <span class="article-date">2026-06-05</span>
                </a>
                <a href="post2.html" class="article-item">
                    <span class="article-title">📖 16岁的夏日碎碎念</span>
                    <span class="article-date">2026-05-20</span>
                </a>
                <a href="post3.html" class="article-item">
                    <span class="article-title">💻 我的前端网页折腾日记</span>
                    <span class="article-date">2026-05-01</span>
                </a>
            </div>
        </div>

        <a href="index.html" class="back-btn">⬅️ 返回主页</a>
    </div>

</body>
</html>
