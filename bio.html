<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍 - 汐沫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(to bottom, #FFD700 0%, #FFD700 25%, #FFFFFF 25%, #FFFFFF 50%, #9C4DC4 50%, #9C4DC4 75%, #000000 75%, #000000 100%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .page-content {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: linear-gradient(135deg, rgba(174, 223, 242, 0.85) 0%, rgba(247, 198, 207, 0.85) 100%);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #111;
            margin-bottom: 16px;
        }

        .bio-text {
            color: #222;
            font-size: 16px;
            line-height: 1.8;
        }

        .back-btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            background: linear-gradient(135deg, rgba(174, 223, 242, 0.85) 0%, rgba(247, 198, 207, 0.85) 100%);
            backdrop-filter: blur(10px);
            color: #22px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: filter 0.2s;
        }

        .back-btn:hover {
            filter: brightness(1.05);
        }
    </style>
</head>
<body>

    <div class="page-content">
        <div class="card">
            <div class="section-title">✨ 关于我</div>
            <div class="bio-text">
                这里是汐沫！今年 16 岁，是一个对世界充满好奇的追光者。喜欢折腾网站、记录生活。很高兴你能来到我的秘密基地，希望能在这里和你成为朋友！
            </div>
        </div>

        <a href="index.html" class="back-btn">⬅️ 返回主页</a>
    </div>

</body>
</html>
